databases:
  - name: mediqueue-db
    databaseName: mediqueue
    user: mediqueue_user
    plan: free                         # Free 90-day PostgreSQL on Render

services:
  - type: web
    name: mediqueue-backend
    runtime: docker
    # Path to backend Dockerfile, relative to repo root
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Render auto-injects JDBC_DATABASE_URL from the linked database
      - fromDatabase:
          name: mediqueue-db
          property: jdbcConnectionString
        key: JDBC_DATABASE_URL
      - fromDatabase:
          name: mediqueue-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: mediqueue-db
          property: password
        key: DB_PASSWORD
