databases:
  - name: mediqueue-db
    databaseName: mediqueue
    user: mediqueue_user
    plan: free                         # Free 90-day PostgreSQL on Render

services:
  - type: web
    name: mediqueue-backend
    runtime: docker
    # Path to backend Dockerfile, relative to repo root
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Inject individual DB connection parts (jdbcConnectionString is not valid on Render)
      - fromDatabase:
          name: mediqueue-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: mediqueue-db
          property: port
        key: DB_PORT
      - fromDatabase:
          name: mediqueue-db
          property: database
        key: DB_NAME
      - fromDatabase:
          name: mediqueue-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: mediqueue-db
          property: password
        key: DB_PASSWORD
