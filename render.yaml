databases:
  - name: mediqueue-db
    databaseName: mediqueue
    user: mediqueue_user
    plan: free

services:
  # Option 1: Express Full-Stack Monolith (Node + Vite React SPA + JSON DB) - Fastest to deploy
  - type: web
    name: mediqueue-express-monolith
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # Option 2: Spring Boot 3 Backend API (Java + PostgreSQL)
  - type: web
    name: mediqueue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - fromDatabase:
          name: mediqueue-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: mediqueue-db
          property: port
        key: DB_PORT
      - fromDatabase:
          name: mediqueue-db
          property: database
        key: DB_NAME
      - fromDatabase:
          name: mediqueue-db
          property: user
        key: DB_USERNAME
      - fromDatabase:
          name: mediqueue-db
          property: password
        key: DB_PASSWORD
