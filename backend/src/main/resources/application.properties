# Spring Application Config
spring.application.name=mediqueue-backend
server.port=8080

# PostgreSQL Database Configuration (Environment variables with safe defaults)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mediqueue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:mediqueue_jwt_secret_key_2026_super_secure_32bytes_min_token_hash}
jwt.expiration=86400000

# Swagger OpenAPI UI Path
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
