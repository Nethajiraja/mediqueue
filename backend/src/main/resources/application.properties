# ─── Spring Application ───────────────────────────────────────────────────────
spring.application.name=mediqueue-backend

# Render injects PORT automatically; fallback to 8080 for local dev
server.port=${PORT:8080}

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
# On Render: set DATABASE_URL env var (copy from Render DB dashboard — no changes needed).
#   RenderDatabaseEnvironmentPostProcessor converts postgresql:// → jdbc:postgresql://
#   and overrides these properties at startup before JPA auto-configuration runs.
#
# Local dev: set DB_* env vars or use these defaults.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mediqueue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — tuned for Render free tier (97 max connections per DB)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA & Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:mediqueue_jwt_secret_key_2026_super_secure_32bytes_min_token_hash}
jwt.expiration=86400000

# ─── Actuator Health (Render health check polls /actuator/health) ──────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
