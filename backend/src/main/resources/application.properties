# Spring Application Config
spring.application.name=mediqueue-backend

# Render sets PORT env var automatically — use it, fallback to 8080 for local dev
server.port=${PORT:8080}

# ─── PostgreSQL Database ───────────────────────────────────────────────────────
# Render provides JDBC_DATABASE_URL (jdbc:postgresql://... format) automatically
# when a Render PostgreSQL database is linked to this service.
# For local development, falls back to localhost.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/mediqueue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool — tuned for Render free tier (limited connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA & Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Prevents startup delay on Render by skipping JDBC metadata check
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:mediqueue_jwt_secret_key_2026_super_secure_32bytes_min_token_hash}
jwt.expiration=86400000

# ─── Actuator Health Endpoint (used by Render health checks) ──────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── Swagger OpenAPI ──────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

